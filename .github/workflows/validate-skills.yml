name: Validate Skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate skill frontmatter + README links
        run: node scripts/validate-skills.mjs

      - name: Check README skill tables are up to date
        run: node scripts/build-readme.mjs --check

      - name: Check CODEOWNERS is up to date
        run: |
          node scripts/build-codeowners.mjs
          git diff --exit-code -- .github/CODEOWNERS
